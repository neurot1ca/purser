name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    env:
      GOTELEMETRY: off
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod

      - name: Vet Go packages
        run: go vet ./...
        working-directory: go

      - name: Test Go packages
        run: go test ./...
        working-directory: go

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Claude Code CLI is not installed in CI, so plugin test/validate are omitted.
